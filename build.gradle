plugins {
    id 'fabric-loom' version "${fabric_loom_version}" apply false
}

tasks.register('cloneJcef', Exec) {
    commandLine 'git', 'submodule', 'update', '--init', '--recursive', 'common/java-cef'
}

// https://gist.github.com/JonasGroeger/7620911
def getCheckedOutGitCommitHash(Project mcefParent) {
    try {
        def gitFolder = "$mcefParent.projectDir/.git/modules/common/java-cef/"
        def takeFromHash = 40
        def gitHeadFile = new File(gitFolder + "HEAD");
        if (gitHeadFile.exists()) {
            def head = gitHeadFile.text.split(":")
            def isCommit = head.length == 1

            if (isCommit) return head[0].trim().take(takeFromHash)

            def refPath = head[1].trim()
            def refHead = new File(gitFolder + refPath)
            if (refHead.exists()) {
                return refHead.text.trim().take(takeFromHash)
            }
        }
    } catch (Exception e) {
        // Fallback or ignore if .git info is missing
    }
    return "unknown"
}

tasks.register('publishMaven', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':common:publish',
          ':fabric:publish',
          ':neoforge:publish'
    ]
}

tasks.register('publishCurseforge', GradleBuild) {
    group = 'mcef'
    tasks = [
            ':common:clean',
            ':neoforge:clean',
            ':fabric:clean',
            ':neoforge:curseforge',
            ':fabric:curseforge'
    ]
}

tasks.register('fabricClient', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':fabric:runClient'
    ]
}

tasks.register('neoforgeClient', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':neoforge:runClient'
    ]
}

tasks.register('fabricServer', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':fabric:runServer'
    ]
}

tasks.register('neoforgeServer', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':neoforge:runServer'
    ]
}

tasks.register('cleanAll', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':common:clean',
          ':fabric:clean',
          ':neoforge:clean',
    ]
}
