plugins {
    id 'fabric-loom' version "${fabric_loom_version}" apply false
}

// https://gist.github.com/JonasGroeger/7620911
def getCheckedOutGitCommitHash(Project mcefParent) {
    try {
        // Fallback to a simple string since java-cef submodule is no longer used for versioning
        return "android-refactor"
    } catch (Exception e) {
    }
    return "unknown"
}

tasks.register('publishMaven', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':common:publish',
          ':fabric:publish',
          ':neoforge:publish'
    ]
}

tasks.register('publishCurseforge', GradleBuild) {
    group = 'mcef'
    tasks = [
            ':common:clean',
            ':neoforge:clean',
            ':fabric:clean',
            ':neoforge:curseforge',
            ':fabric:curseforge'
    ]
}

tasks.register('fabricClient', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':fabric:runClient'
    ]
}

tasks.register('neoforgeClient', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':neoforge:runClient'
    ]
}

tasks.register('fabricServer', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':fabric:runServer'
    ]
}

tasks.register('neoforgeServer', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':neoforge:runServer'
    ]
}

tasks.register('cleanAll', GradleBuild) {
    group = 'mcef'
    tasks = [
          ':common:clean',
          ':fabric:clean',
          ':neoforge:clean',
    ]
}
